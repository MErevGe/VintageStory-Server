name: Build, test and publish container

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', 'docker-compose.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Set repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to also publish
  # to Docker Hub (docker.io/<user>/<repo>); leave unset to publish only to GHCR.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # OIDC token for signing the provenance attestation
      attestations: write  # store the attestation in GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: "7.0"
            variant: dotnet7
            expect_dotnet: "7"
            test_vs: "1.20.12"
          - dotnet: "8.0"
            variant: dotnet8
            expect_dotnet: "8"
            test_vs: "1.21.5"
          - dotnet: "10.0"
            variant: dotnet10
            expect_dotnet: "10"
            test_vs: "1.22.3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          variant="${{ matrix.variant }}"
          image="${IMAGE_NAME,,}"          # registries require lowercase
          bases=("${REGISTRY}/${image}")
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            bases+=("docker.io/${DOCKERHUB_USERNAME}/${image##*/}")
          fi
          tags=""
          for b in "${bases[@]}"; do
            tags="${tags:+$tags,}${b}:${variant}"
          done
          echo "push_tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "test_tag=vintagestory-ci:${variant}" >> "$GITHUB_OUTPUT"
          echo "ghcr_ref=${REGISTRY}/${image}" >> "$GITHUB_OUTPUT"

      - name: Build image for testing (.NET ${{ matrix.dotnet }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: DOTNET_VERSION=${{ matrix.dotnet }}
          tags: ${{ steps.tags.outputs.test_tag }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Test image
        env:
          EXPECT_DOTNET: ${{ matrix.expect_dotnet }}
          TEST_VS_VERSION: ${{ matrix.test_vs }}
        run: |
          chmod +x tests/smoke-test.sh
          ./tests/smoke-test.sh ${{ steps.tags.outputs.test_tag }}

      - name: Build and push
        id: build
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: DOTNET_VERSION=${{ matrix.dotnet }}
          tags: ${{ steps.tags.outputs.push_tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: mode=max   # attach SLSA provenance to the pushed image(s)
          sbom: true             # attach an SBOM to the pushed image(s)

      # GitHub-native provenance attestation for the GHCR image, verifiable with
      # `gh attestation verify oci://...`. Pushed images on Docker Hub still carry
      # the in-image provenance/SBOM attached above. Only runs on a public repo:
      # artifact attestations are not available for user-owned private repos.
      - name: Attest build provenance (GHCR)
        if: github.ref == 'refs/heads/main' && github.event.repository.private == false
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4
        with:
          subject-name: ${{ steps.tags.outputs.ghcr_ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Retag dotnet10 as :latest only after every variant is pushed, so :latest is
  # always the newest tag and registry UIs show it as the default.
  tag-latest:
    needs: build-test-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Point :latest at :dotnet10
        run: |
          image="${IMAGE_NAME,,}"
          docker buildx imagetools create -t "${REGISTRY}/${image}:latest" "${REGISTRY}/${image}:dotnet10"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            hub="docker.io/${DOCKERHUB_USERNAME}/${image##*/}"
            docker buildx imagetools create -t "${hub}:latest" "${hub}:dotnet10"
          fi

  # Single stable check to require in branch protection (the matrix job names vary
  # with the tested VS version). Fails unless every matrix leg succeeded.
  ci-gate:
    name: CI gate
    needs: build-test-push
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the build to have succeeded
        run: |
          if [ "${{ needs.build-test-push.result }}" != "success" ]; then
            echo "build-test-push result: ${{ needs.build-test-push.result }}"
            exit 1
          fi
          echo "all matrix builds passed"
